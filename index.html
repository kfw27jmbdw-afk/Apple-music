<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title> Gemini Music - V24 Master</title>
<style>
:root{ --bg:#000; --panel:#1c1c1e; --accent:#007aff; --text:#fff; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,sans-serif; height:100vh; display:flex; align-items:center; justify-content:center; }
.player-card{ background:var(--panel); width:310px; padding:30px; border-radius:40px; text-align:center; box-shadow:0 40px 100px rgba(0,0,0,.8); border:1px solid rgba(255,255,255,0.05); }
#art-box{ width:100%; aspect-ratio:1/1; border-radius:24px; overflow:hidden; margin-bottom:20px; }
#art-img{ width:100%; height:100%; object-fit:cover; transition:0.4s; }
.playing #art-img{ transform:scale(1.05); }
h2{ margin:0; font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
p{ margin:8px 0 25px; color:#8e8e93; font-size:14px; }
.main-btn{ width:75px; height:75px; border:none; border-radius:50%; font-size:28px; background:var(--accent); color:#fff; cursor:pointer; outline:none; }
.btn-pick{ display:block; margin-top:20px; background:rgba(255,255,255,0.1); padding:15px; border-radius:16px; font-size:12px; font-weight:700; position:relative; overflow:hidden; }
.btn-pick input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
</style>
</head>
<body>

<div class="player-card" id="player">
  <div id="art-box"><img id="art-img" src="https://raw.githubusercontent.com/kfw27jmbdw-afk/Apple-music/main/music/IMG_2430.jpeg"></div>
  <h2 id="title">Select Song</h2>
  <p id="artist">V24 Legend Engine</p>
  <button id="play-btn" class="main-btn">▶</button>
  <label class="btn-pick">🎵 ADD MP3 <input type="file" accept=".mp3,.m4a,.wav" onchange="loadV24(this)"></label>
</div>

<audio id="audio-engine" preload="auto" playsinline></audio>

<script>
const audio = document.getElementById("audio-engine");
const playBtn = document.getElementById("play-btn");
const player = document.getElementById("player");
let currentUrl = null;

function loadV24(input){
  const file = input.files[0];
  if(!file) return;

  if(currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl = URL.createObjectURL(file);
  
  audio.src = currentUrl;
  audio.load();

  const name = file.name.replace(/\.[^/.]+$/, "");
  document.getElementById("title").innerText = name;
  
  initMediaSession(name);
  
  playBtn.innerHTML = "▶";
  player.classList.remove("playing");
}

// 🟢 THE MASTER PLAYBACK FUNCTION
async function togglePlay() {
  if(!audio.src) return;

  if(audio.paused){
    try {
      //  iOS/Android Fix: Seconds chal rahe hon par sound na aaye toh reset karo
      if (audio.currentTime > 0) {
        audio.currentTime = audio.currentTime; // Hardware Kick
      }
      
      await audio.play();
      playBtn.innerHTML = "⏸";
      player.classList.add("playing");
      updateState("playing");
    } catch (e) { 
        // Agar pehli baar fail ho toh user gesture se re-try
        console.error("Play failed", e); 
    }
  } else {
    audio.pause();
    playBtn.innerHTML = "▶";
    player.classList.remove("playing");
    updateState("paused");
  }
}

playBtn.addEventListener("click", togglePlay);

// 🟢 LOCK SCREEN HANDLERS (The Secret Sauce)
function initMediaSession(name) {
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: name,
      artist: "Gemini Music Lab",
      artwork: [{ src: document.getElementById("art-img").src, sizes: '512x512', type: 'image/jpeg' }]
    });

    navigator.mediaSession.setActionHandler('play', async () => {
      //  AWAAZ WAPAS LANE KA JADOO: 
      // Pehle play karo, fir currentTime ko 0.01s hila do hardware reset ke liye
      await audio.play();
      audio.currentTime = audio.currentTime; 
      
      playBtn.innerHTML = "⏸";
      player.classList.add("playing");
      updateState("playing");
    });

    navigator.mediaSession.setActionHandler('pause', () => {
      audio.pause();
      playBtn.innerHTML = "▶";
      player.classList.remove("playing");
      updateState("paused");
    });
  }
}

function updateState(state) {
  if ('mediaSession' in navigator) {
    navigator.mediaSession.playbackState = state;
  }
}

// Ensure background stays alive
audio.onplay = () => updateState("playing");
audio.onpause = () => updateState("paused");
audio.onended = () => {
  playBtn.innerHTML = "▶";
  player.classList.remove("playing");
  updateState("none");
};
</script>
</body>
</html>
