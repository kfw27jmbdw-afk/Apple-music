  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --apple-red: #ff375f;
      --apple-bg: #000000;
      --apple-panel: #121214;
      --apple-border: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--apple-bg);
      color: #f5f5f7;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    .code-font {
      font-family: 'Fira Code', monospace;
      tab-size: 2;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 4px;
    }

    /* Hardware frame & Dynamic Island */
    .iphone-frame {
      box-shadow: 0 25px 65px -10px rgba(0, 0, 0, 0.95), 
                  0 0 0 10px #242426, 
                  0 0 0 12px #141416,
                  0 0 0 13px rgba(255, 255, 255, 0.12);
      transition: width 0.25s ease, height 0.25s ease, transform 0.2s ease;
      background: #000;
    }

    .notch-island {
      width: 112px;
      height: 28px;
      background: #000000;
      border-radius: 18px;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      pointer-events: none;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
    }

    .notch-camera-dot {
      width: 10px;
      height: 10px;
      background: #0a0b12;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* Mobile Screen Toggle Classes */
    @media (max-width: 768px) {
      body.mobile-view-editor #editor-pane {
        display: flex !important;
        width: 100% !important;
        height: 100% !important;
      }
      body.mobile-view-editor #preview-pane {
        display: none !important;
      }
      body.mobile-view-preview #editor-pane {
        display: none !important;
      }
      body.mobile-view-preview #preview-pane {
        display: flex !important;
        width: 100% !important;
        height: 100% !important;
      }
    }
  </style>

  <!-- CRITICAL: DEFINE ALL GLOBAL HANDLERS EARLY TO PREVENT REFERENCE ERRORS -->
  <script>
    window.mobileScreenMode = 'editor';
    window.currentTab = 'html';
    window.currentDevice = 'iphone13';
    window.isLandscape = false;
    window.islandVisible = true;
    window.boundsInspectActive = false;
    window.debounceTimer = null;
    window._currentBlobUrl = null;
    window.logCount = 0;

    window.setMobileScreenMode = function(mode) {
      window.mobileScreenMode = mode;
      document.body.classList.remove('mobile-view-editor', 'mobile-view-preview');
      document.body.classList.add('mobile-view-' + mode);

      var btnEd = document.getElementById('mobile-toggle-editor');
      var btnPv = document.getElementById('mobile-toggle-preview');

      if (btnEd && btnPv) {
        if (mode === 'editor') {
          btnEd.className = 'px-3 py-1 text-xs font-bold rounded-lg bg-rose-600 text-white transition flex items-center gap-1';
          btnPv.className = 'px-3 py-1 text-xs font-bold rounded-lg text-neutral-400 hover:text-white transition flex items-center gap-1';
        } else {
          btnPv.className = 'px-3 py-1 text-xs font-bold rounded-lg bg-rose-600 text-white transition flex items-center gap-1';
          btnEd.className = 'px-3 py-1 text-xs font-bold rounded-lg text-neutral-400 hover:text-white transition flex items-center gap-1';
          setTimeout(function() {
            if (typeof window.updateCanvasScale === 'function') window.updateCanvasScale();
          }, 60);
        }
      }
    };
  </script>
</head>

      ['html', 'css', 'js'].forEach(t => {
        const btn = document.getElementById('tab-' + t);
        const container = document.getElementById('editor-container-' + t);
        if (t === tab) {
          btn.className = 'px-3 py-1.5 text-xs font-semibold rounded-t-lg bg-[#0c0c0e] text-white border-t-2 border-rose-500 flex items-center gap-1.5';
          container.classList.remove('hidden');
          container.classList.add('flex');
        } else {
          btn.className = 'px-3 py-1.5 text-xs font-semibold rounded-t-lg text-neutral-400 hover:text-white flex items-center gap-1.5';
          container.classList.remove('flex');
          container.classList.add('hidden');
        }
      });
    };

    // Live Compile & Sandbox Injection
    window.updatePreview = function(force) {
      const autoRun = document.getElementById('auto-run-toggle').checked;
      if (!autoRun && !force) return;

      const rawHtml = document.getElementById('editor-html').value;
      const rawCss = document.getElementById('editor-css').value;
      const rawJs = document.getElementById('editor-js').value;

      // Clean HTML wrapper if full boilerplate was pasted
      let bodyContent = rawHtml;
      const bodyMatch = rawHtml.match(/<body[^>]*>([\s\S]*)<\/body>/i);
      if (bodyMatch) bodyContent = bodyMatch[1];

      // Bounding box overlay styles
      const boundsCss = window.boundsInspectActive ? `
        #song-image { outline: 2.5px dashed #ff3b30 !important; }
        #synced-lyrics-view { outline: 2px dashed #30d158 !important; }
        .player-header { outline: 2px dashed #0a84ff !important; }
      ` : '';

      const finalHtmlDoc = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    ${rawCss}
    ${boundsCss}
  </style>
</head>
<body>
  ${bodyContent}
  
  <script>
    // Intercept errors and forward to studio console
    window.onerror = function(msg, url, line) {
      window.parent.postMessage({ type: 'ERROR', data: msg + ' (Line: ' + line + ')' }, '*');
      return false;
    };
    
    // Intercept console.log
    const _origLog = console.log;
    console.log = function() {
      const args = Array.from(arguments).map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
      window.parent.postMessage({ type: 'LOG', data: args }, '*');
      _origLog.apply(console, arguments);
    };

    try {
      ${rawJs}
    } catch(err) {
      window.parent.postMessage({ type: 'ERROR', data: err.message }, '*');
    }
  <\/script>
</body>
</html>`;

      const frame = document.getElementById('preview-frame');
      if (!frame) return;

      try {
        if (window._currentBlobUrl) {
          URL.revokeObjectURL(window._currentBlobUrl);
        }
        const blob = new Blob([finalHtmlDoc], { type: 'text/html;charset=UTF-8' });
        window._currentBlobUrl = URL.createObjectURL(blob);
        frame.src = window._currentBlobUrl;
        
        window.setAppStatus('Live & Synced', 'bg-emerald-500');
      } catch (e) {
        frame.srcdoc = finalHtmlDoc;
        window.setAppStatus('Live (Fallback)', 'bg-emerald-500');
      }
    };

    // Device Preset Selection
    window.setDevicePreset = function(preset) {
      window.currentDevice = preset;
      const wrapper = document.getElementById('device-wrapper');
      const notch = document.getElementById('dynamic-island-notch');

      const btnPhone = document.getElementById('btn-device-iphone13');
      const btnFluid = document.getElementById('btn-device-fluid');

      if (preset === 'iphone13') {
        btnPhone.className = 'px-2.5 py-1 text-xs font-semibold rounded-lg bg-rose-600 text-white transition flex items-center gap-1';
        btnFluid.className = 'px-2.5 py-1 text-xs font-semibold rounded-lg text-neutral-400 hover:text-white transition flex items-center gap-1';
        
        wrapper.className = 'iphone-frame relative rounded-[46px] overflow-hidden flex flex-col';
        wrapper.style.width = window.isLandscape ? '844px' : '390px';
        wrapper.style.height = window.isLandscape ? '390px' : '844px';
        notch.style.display = window.islandVisible ? 'flex' : 'none';
        document.getElementById('canvas-resolution-label').innerText = (window.isLandscape ? '844 x 390' : '390 x 844') + ' px (iPhone 13/16)';
      } else {
        btnFluid.className = 'px-2.5 py-1 text-xs font-semibold rounded-lg bg-rose-600 text-white transition flex items-center gap-1';
        btnPhone.className = 'px-2.5 py-1 text-xs font-semibold rounded-lg text-neutral-400 hover:text-white transition flex items-center gap-1';
        
        wrapper.className = 'relative w-full h-full rounded-none overflow-hidden flex flex-col border border-neutral-800';
        wrapper.style.width = '100%';
        wrapper.style.height = '100%';
        wrapper.style.transform = 'none';
        notch.style.display = 'none';
        document.getElementById('canvas-resolution-label').innerText = '100% Fluid Viewport';
      }

      window.updateCanvasScale();
    };

    // Auto-scale device canvas to fit any screen
    window.updateCanvasScale = function() {
      const canvas = document.getElementById('viewport-canvas');
      const wrapper = document.getElementById('device-wrapper');
      if (!canvas || !wrapper || window.currentDevice === 'fluid') {
        if (wrapper && window.currentDevice === 'fluid') wrapper.style.transform = 'none';
        return;
      }

      const frameWidth = parseInt(wrapper.style.width) || 390;
      const frameHeight = parseInt(wrapper.style.height) || 844;

      const availWidth = canvas.clientWidth - 16;
      const availHeight = canvas.clientHeight - 20;

      const scale = Math.min(availWidth / frameWidth, availHeight / frameHeight, 1);
      const safeScale = Math.max(scale, 0.72); // Keep legible on mobile

      wrapper.style.transform = 'scale(' + safeScale.toFixed(2) + ')';
      document.getElementById('scale-indicator').innerText = 'Scale: ' + Math.round(safeScale * 100) + '%';
    };

    // Diagnostic Helpers
    window.injectLyricTest = function(type) {
      let text = "तुझसे मन नहीं है भरता...";
      if (type === 'double_hindi') {
        text = "तुझसे मन नहीं है भरता, अब तू ही है कर्ता-धर्ता";
      } else if (type === 'triple_overflow') {
        text = "बैठा रोज गिणूँ तारे अर सोऊँ रात नै वारी मैं, घणी दूर है तेरे घर ते मेरी गली...";
      }

      const frame = document.getElementById('preview-frame');
      if (frame && frame.contentDocument) {
        const el = frame.contentDocument.getElementById('demo-lyric-line');
        if (el) {
          el.innerText = text;
          window.setAppStatus('Lyric Test Applied', 'bg-purple-500');
        }
      }
    };

    window.toggleBoundingBoxInspector = function() {
      window.boundsInspectActive = !window.boundsInspectActive;
      const btn = document.getElementById('toggle-bounds-btn');
      btn.className = window.boundsInspectActive 
        ? 'px-2 py-1 text-xs rounded-lg bg-emerald-600 text-white border border-emerald-500 transition'
        : 'px-2 py-1 text-xs rounded-lg bg-neutral-800 text-neutral-300 border border-neutral-700 transition';
      window.updatePreview(true);
    };

    window.injectCoverGapTest = function() {
      window.toggleBoundingBoxInspector();
    };

    window.toggleDynamicIsland = function() {
      window.islandVisible = !window.islandVisible;
      document.getElementById('dynamic-island-notch').style.display = window.islandVisible ? 'flex' : 'none';
    };

    window.toggleOrientation = function() {
      if (window.currentDevice === 'fluid') return;
      window.isLandscape = !window.isLandscape;
      window.setDevicePreset('iphone13');
    };

    // Console drawer handlers
    window.toggleConsoleDrawer = function() {
      document.getElementById('console-drawer').classList.toggle('hidden');
    };

    window.clearConsoleLogs = function() {
      window.logCount = 0;
      document.getElementById('console-count').innerText = '0';
      document.getElementById('console-logs-list').innerHTML = '<div class="text-neutral-500 italic">Logs cleared.</div>';
    };

    window.setAppStatus = function(text, colorClass) {
      document.getElementById('status-text').innerText = text;
      document.getElementById('status-dot').className = 'w-2 h-2 rounded-full ' + colorClass;
    };

    window.copyCurrentCode = function() {
      const el = document.getElementById('editor-' + window.currentTab);
      if (!el) return;
      el.select();
      document.execCommand('copy');
      window.setAppStatus('Copied to Clipboard!', 'bg-emerald-500');
      setTimeout(() => window.setAppStatus('Live & Synced', 'bg-emerald-500'), 1500);
    };

    window.clearCurrentCode = function() {
      const el = document.getElementById('editor-' + window.currentTab);
      if (el) {
        el.value = '';
        window.updatePreview(true);
      }
    };

    window.resetToSampleCode = function() {
      document.getElementById('editor-html').value = window.DEFAULT_HTML;
      document.getElementById('editor-css').value = window.DEFAULT_CSS;
      document.getElementById('editor-js').value = window.DEFAULT_JS;
      window.updatePreview(true);
    };

    // Event Listeners for logs and input debounce
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type) {
        window.logCount++;
        document.getElementById('console-count').innerText = window.logCount;
        const list = document.getElementById('console-logs-list');
        if (window.logCount === 1) list.innerHTML = '';
        
        const item = document.createElement('div');
        item.className = 'py-0.5 border-b border-neutral-900 break-all';
        item.innerHTML = (e.data.type === 'ERROR' ? '<span class="text-rose-400 font-bold">[ERR]</span> ' : '<span class="text-neutral-400">[LOG]</span> ') + e.data.data;
        list.appendChild(item);
      }
    });

    ['html', 'css', 'js'].forEach(tab => {
      document.getElementById('editor-' + tab).addEventListener('input', function() {
        clearTimeout(window.debounceTimer);
        window.debounceTimer = setTimeout(function() {
          window.updatePreview(false);
        }, 300);
      });
    });

    window.addEventListener('resize', function() {
      window.updateCanvasScale();
    });

    // Initial Load
    window.addEventListener('DOMContentLoaded', function() {
      window.resetToSampleCode();
      window.updateCanvasScale();
    });
  </script>
</body>
</html>
