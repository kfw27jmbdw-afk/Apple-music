<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title> Gemini Mini Music - V24.5</title>

<style>
:root{
  --bg:#000;
  --panel:#1c1c1e;
  --accent:#007aff;
  --text:#fff;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.player-card{
  background:var(--panel);
  width:320px;
  padding:28px;
  border-radius:40px;
  text-align:center;
  box-shadow:0 40px 100px rgba(0,0,0,.8);
  border: 1px solid rgba(255,255,255,0.05);
}
#art-box{
  width:100%;
  aspect-ratio:1/1;
  border-radius:24px;
  overflow:hidden;
  margin-bottom:20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
#art-img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.4s cubic-bezier(0.2, 0, 0.2, 1);
}
.playing #art-img{
  transform:scale(1.05);
}
h2{
  margin:0;
  font-size:18px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
p{
  margin:8px 0 20px;
  color:#8e8e93;
  font-size:14px;
}
.main-btn{
  width:75px;
  height:75px;
  border:none;
  border-radius:50%;
  font-size:28px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
  transition: 0.2s;
}
.main-btn:active{
  transform: scale(0.9);
}
.picker-container{
  display:flex;
  gap:12px;
  margin-top:20px;
}
.btn-pick{
  flex:1;
  background:rgba(255,255,255,.1);
  padding:15px;
  border-radius:16px;
  font-size:12px;
  font-weight:700;
  position:relative;
  overflow:hidden;
  border: 1px solid rgba(255,255,255,0.1);
}
.btn-pick input[type=file]{
  position:absolute;
  inset:0;
  opacity:0;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="player-card" id="player">
  <div id="art-box">
    <img id="art-img" src="https://raw.githubusercontent.com/kfw27jmbdw-afk/Apple-music/main/music/IMG_2430.jpeg">
  </div>

  <h2 id="title">Select a Song</h2>
  <p id="artist">V24.5 Stable Engine</p>

  <button id="play-btn" class="main-btn">▶</button>

  <div class="picker-container">
    <label class="btn-pick">
      🎵 ADD SONG
      <input type="file"
             accept=".mp3,.m4a,.wav,.aac,.flac"
             onchange="loadSong(this)">
    </label>
  </div>
</div>

<audio id="audio-engine" preload="auto"></audio>

<script>
const audio = document.getElementById("audio-engine");
const playBtn = document.getElementById("play-btn");
const player = document.getElementById("player");
let currentUrl = null;

// 🟢 Load Song (Clickable Fix + Metadata Init)
function loadSong(input){
  const file = input.files[0];
  if(!file) return;

  if(currentUrl) URL.revokeObjectURL(currentUrl);

  currentUrl = URL.createObjectURL(file);
  audio.src = currentUrl;
  audio.load();

  const cleanName = file.name.replace(/\.[^/.]+$/, "");
  document.getElementById("title").innerText = cleanName;
  document.getElementById("artist").innerText = "Local File";

  // iTunes Artwork Search
  fetchArtwork(cleanName);

  // Playback Reset
  playBtn.innerHTML = "▶";
  player.classList.remove("playing");
  
  // Media Session Reset (Crucial for Lock Screen)
  initMediaSession(cleanName);
}

// 🟢 Play/Pause Logic (Gesture Safe)
async function togglePlayback() {
  if(!audio.src) return;

  if(audio.paused){
    try {
      await audio.play();
      playBtn.innerHTML = "⏸";
      player.classList.add("playing");
      navigator.mediaSession.playbackState = "playing";
    } catch (err) {
      console.error("Playback failed", err);
    }
  } else {
    audio.pause();
    playBtn.innerHTML = "▶";
    player.classList.remove("playing");
    navigator.mediaSession.playbackState = "paused";
  }
}

playBtn.addEventListener("click", togglePlayback);

// 🟢 LOCK SCREEN PERSISTENCE FIX
function initMediaSession(name) {
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: name,
      artist: "Gemini Music Lab",
      artwork: [{ src: document.getElementById("art-img").src, sizes: '512x512', type: 'image/jpeg' }]
    });

    // LOCK SCREEN HANDLERS (Ye pause ke baad play fix karta hai)
    navigator.mediaSession.setActionHandler('play', togglePlayback);
    navigator.mediaSession.setActionHandler('pause', togglePlayback);
    
    // Seek handlers (Optionally added for better control)
    navigator.mediaSession.setActionHandler('seekbackward', () => { audio.currentTime -= 10; });
    navigator.mediaSession.setActionHandler('seekforward', () => { audio.currentTime += 10; });
  }
}

// 🟢 iTunes Artwork Sync
async function fetchArtwork(name) {
    try {
        const query = name.split(/[\s-_]+/).slice(0, 3).join(' ');
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&limit=1`);
        const data = await res.json();
        if (data.results.length > 0) {
            const track = data.results[0];
            const artUrl = track.artworkUrl100.replace('100x100', '600x600');
            document.getElementById("art-img").src = artUrl;
            document.getElementById("artist").innerText = track.artistName;
            
            // Re-sync lock screen artwork
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata.artwork = [{ src: artUrl, sizes: '512x512', type: 'image/jpeg' }];
            }
        }
    } catch (e) {}
}

audio.addEventListener("ended", () => {
  playBtn.innerHTML = "▶";
  player.classList.remove("playing");
  navigator.mediaSession.playbackState = "none";
});
</script>

</body>
</html>
