<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title> Gemini Music - V24 Master Fix</title>
<style>
:root{ --bg:#000; --panel:#1c1c1e; --accent:#007aff; --text:#fff; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,sans-serif; height:100vh; display:flex; align-items:center; justify-content:center; }
.player-card{ background:var(--panel); width:310px; padding:30px; border-radius:40px; text-align:center; box-shadow:0 40px 100px rgba(0,0,0,.8); border:1px solid rgba(255,255,255,0.05); }
#art-box{ width:100%; aspect-ratio:1/1; border-radius:24px; overflow:hidden; margin-bottom:20px; box-shadow:0 15px 40px rgba(0,0,0,0.5); }
#art-img{ width:100%; height:100%; object-fit:cover; transition:0.4s; }
.playing #art-img{ transform:scale(1.05); }
h2{ margin:0; font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
p{ margin:8px 0 25px; color:#8e8e93; font-size:14px; }
.main-btn{ width:75px; height:75px; border:none; border-radius:50%; font-size:28px; background:var(--accent); color:#fff; cursor:pointer; outline:none; }
.btn-pick{ display:block; margin-top:20px; background:rgba(255,255,255,0.1); padding:15px; border-radius:16px; font-size:12px; font-weight:700; position:relative; overflow:hidden; }
.btn-pick input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
</style>
</head>
<body>

<div class="player-card" id="player">
  <div id="art-box"><img id="art-img" src="https://raw.githubusercontent.com/kfw27jmbdw-afk/Apple-music/main/music/IMG_2430.jpeg"></div>
  <h2 id="title">Select Song</h2>
  <p id="artist">Hardware Lock Active</p>
  <button id="play-btn" class="main-btn">▶</button>
  <label class="btn-pick">🎵 ADD MP3 <input type="file" accept=".mp3,.m4a,.wav" onchange="loadV24(this)"></label>
</div>

<audio id="audio-engine" preload="auto" playsinline crossorigin="anonymous"></audio>

<script>
const audio = document.getElementById("audio-engine");
const playBtn = document.getElementById("play-btn");
const player = document.getElementById("player");

let audioCtx, source, gainNode;

// 🟢 STEP 1: Hardware ko "Jinda" karne ka function
function initHardware() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        source = audioCtx.createMediaElementSource(audio);
        gainNode = audioCtx.createGain();
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
    }
}

function loadV24(input){
  const file = input.files[0];
  if(!file) return;

  const url = URL.createObjectURL(file);
  audio.src = url;
  audio.load();

  const name = file.name.replace(/\.[^/.]+$/, "");
  document.getElementById("title").innerText = name;
  
  updateMediaSession(name);
  playBtn.innerHTML = "▶";
  player.classList.remove("playing");
}

// 🟢 STEP 2: Playback with Force Resume
async function togglePlay() {
  if(!audio.src) return;
  
  initHardware(); // Pehle hardware connect karo

  if(audio.paused){
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    await audio.play();
    playBtn.innerHTML = "⏸";
    player.classList.add("playing");
  } else {
    audio.pause();
    playBtn.innerHTML = "▶";
    player.classList.remove("playing");
  }
}

playBtn.addEventListener("click", togglePlay);

// 🟢 STEP 3: Lock Screen Play Fix (Hardware Wakeup)
function updateMediaSession(name) {
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: name,
      artist: "Gemini V24 Master",
      artwork: [{ src: document.getElementById("art-img").src, sizes: '512x512', type: 'image/jpeg' }]
    });

    navigator.mediaSession.setActionHandler('play', async () => {
      //  ASLI FIX: Lock screen se play dabate hi hardware jagao
      if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
      await audio.play();
      playBtn.innerHTML = "⏸";
      player.classList.add("playing");
    });

    navigator.mediaSession.setActionHandler('pause', () => {
      audio.pause();
      playBtn.innerHTML = "▶";
      player.classList.remove("playing");
    });
  }
}

// Sync session state to avoid kill
audio.onplay = () => { if('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing"; };
audio.onpause = () => { if('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused"; };

</script>
</body>
</html>
