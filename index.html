<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> Gemini Music Lab - Full View IDE</title>
    <style>
        :root { --bg: #1c1c1e; --panel: #2c2c2e; --accent: #34c759; --text: #ffffff; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Toolbar */
        header { padding: 10px 15px; background: var(--panel); border-bottom: 1px solid #3a3a3c; display: flex; gap: 8px; align-items: center; z-index: 100; }
        .btn { background: #3a3a3c; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .run-btn { background: #007aff; }
        .full-btn { background: #5856d6; }
        
        /* Tabs */
        .tabs { display: flex; background: #111; padding: 5px 10px 0; gap: 5px; }
        .tab { padding: 10px 18px; background: #2c2c2e; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 11px; color: #8e8e93; border: none; text-transform: uppercase; letter-spacing: 1px; }
        .tab.active { background: var(--panel); color: white; font-weight: bold; }

        /* Workspace */
        .main { display: flex; flex: 1; overflow: hidden; position: relative; }
        .editor-container { width: 50%; display: flex; flex-direction: column; border-right: 1px solid #3a3a3c; }
        textarea { flex: 1; background: #000; color: #d4d4d4; font-family: 'SF Mono', 'Consolas', monospace; padding: 15px; border: none; resize: none; font-size: 14px; outline: none; line-height: 1.6; display: none; }
        textarea.active { display: block; }
        
        /* Preview Frame */
        #preview { width: 50%; background: #000; border: none; transition: all 0.3s ease-in-out; }
        
        /* 📱 FULL VIEW CLASS */
        body.full-mode .editor-container, body.full-mode .tabs, body.full-mode header :not(.full-btn) { display: none !important; }
        body.full-mode #preview { width: 100% !important; height: 100vh !important; position: fixed; top: 0; left: 0; z-index: 999; }
        .exit-full { position: fixed; bottom: 20px; right: 20px; z-index: 1000; padding: 12px 20px; background: rgba(0,0,0,0.7); color: white; border-radius: 50px; display: none; border: 1px solid #444; backdrop-filter: blur(10px); }
        body.full-mode .exit-full { display: block; }

        #search-box { position: absolute; top: 10px; right: 20px; background: #333; padding: 5px; border-radius: 4px; display: none; border: 1px solid #007aff; z-index: 101; }
        #search-box input { background: transparent; border: none; color: white; outline: none; width: 120px; }
    </style>
</head>
<body>

<header>
    <button class="btn run-btn" onclick="runCode()">RUN</button>
    <button class="btn full-btn" onclick="toggleFullView()">FULL VIEW</button>
    <button class="btn" onclick="undo()">UNDO</button>
    <button class="btn" onclick="toggleSearch()">FIND</button>
    
    <div id="search-box">
        <input type="text" id="searchInput" placeholder="Search code..." oninput="findInCode()">
    </div>
</header>

<div class="tabs">
    <button class="tab active" onclick="openTab(event, 'html')">HTML</button>
    <button class="tab" onclick="openTab(event, 'css')">CSS</button>
    <button class="tab" onclick="openTab(event, 'js')">JS</button>
</div>

<div class="main">
    <div class="editor-container">
        <textarea id="html" class="active" spellcheck="false"></textarea>
        <textarea id="css" spellcheck="false"></textarea>
        <textarea id="js" spellcheck="false"></textarea>
    </div>
    <iframe id="preview"></iframe>
</div>

<button class="exit-full" onclick="toggleFullView()">✕ Exit Full Mode</button>

<script>
    const editors = {
        html: document.getElementById('html'),
        css: document.getElementById('css'),
        js: document.getElementById('js')
    };
    let history = { html: [], css: [], js: [] };

    function toggleFullView() {
        document.body.classList.toggle('full-mode');
        if (!document.body.classList.contains('full-mode')) {
            runCode(); // Refresh on exit to ensure layout is correct
        }
    }

    function openTab(evt, lang) {
        document.querySelectorAll('textarea').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        editors[lang].classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    Object.keys(editors).forEach(lang => {
        editors[lang].addEventListener('input', () => {
            if (history[lang].length > 30) history[lang].shift();
            history[lang].push(editors[lang].value);
            localStorage.setItem('lab_v2_' + lang, editors[lang].value);
        });
        editors[lang].value = localStorage.getItem('lab_v2_' + lang) || "";
    });

    function undo() {
        const activeEditor = document.querySelector('textarea.active');
        const lang = activeEditor.id;
        if (history[lang].length > 1) {
            history[lang].pop();
            activeEditor.value = history[lang][history[lang].length - 1];
        }
    }

    function toggleSearch() {
        const box = document.getElementById('search-box');
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
        if(box.style.display === 'block') document.getElementById('searchInput').focus();
    }

    function findInCode() {
        const query = document.getElementById('searchInput').value;
        const activeEditor = document.querySelector('textarea.active');
        const index = activeEditor.value.indexOf(query);
        if (index !== -1) {
            activeEditor.setSelectionRange(index, index + query.length);
            activeEditor.focus();
        }
    }

    function runCode() {
        const html = editors.html.value;
        const css = `<style>${editors.css.value}</style>`;
        const js = `<script>${editors.js.value}<\/script>`;
        const preview = document.getElementById('preview').contentWindow.document;
        preview.open();
        preview.write(html + css + js);
        preview.close();
    }

    document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); runCode(); }
    });

    runCode();
</script>

</body>
</html>
