<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> Music Mini-Lab</title>

<style>

:root{
--apple-red:#ff3b30;
--apple-dark:#1c1c1e;
}

body{
background:#000;
color:#fff;
font-family:-apple-system,sans-serif;
padding:20px;
display:flex;
flex-direction:column;
align-items:center;
}

.container{
width:100%;
max-width:400px;
}

.card{
background:#1c1c1e;
padding:15px;
border-radius:12px;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
background:#000;
border:1px solid #444;
color:#fff;
border-radius:8px;
}

button{
margin-top:10px;
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#ff3b30;
color:white;
font-weight:bold;
}

.result-item{
display:flex;
align-items:center;
padding:10px;
background:#1c1c1e;
margin-top:10px;
border-radius:10px;
}

.result-item img{
width:55px;
height:55px;
border-radius:6px;
margin-right:10px;
}

#folder-config,
#search-section,
#player{
display:none;
}

#player{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
padding:15px;
}

audio{
width:100%;
filter:invert(1);
}

</style>

</head>
<body>

<div class="container">

<div class="card" id="auth-card">

<label>OAuth Client ID</label>

<input id="client-id">

<button onclick="connectDrive()">
Connect Google Drive
</button>

</div>


<div class="card" id="folder-config">

<label>Folder ID</label>

<input id="folder-id">

</div>


<div id="search-section">

<input
id="search"
placeholder="Search song"
oninput="searchSongs()">

<div id="results"></div>

</div>

</div>


<div id="player">

<b id="title"></b><br>

<small id="artist"></small>

<audio id="audio" controls></audio>

</div>


<script src="https://apis.google.com/js/api.js"></script>

<script src="https://accounts.google.com/gsi/client"></script>


<script>

let accessToken=null;


/////////////////////////////
// INIT GAPI
/////////////////////////////

gapi.load("client",async()=>{

await gapi.client.init({

discoveryDocs:[
"https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"
]

});

});


/////////////////////////////
// HANDLE REDIRECT RETURN
/////////////////////////////

window.onload=()=>{

const hash=window.location.hash;

if(hash.includes("access_token")){

const params=new URLSearchParams(hash.substring(1));

accessToken=params.get("access_token");

gapi.client.setToken({
access_token:accessToken
});

showApp();

history.replaceState(
{},
document.title,
window.location.pathname
);

}

};


/////////////////////////////
// CONNECT DRIVE
/////////////////////////////

function connectDrive(){

const clientID=
document.getElementById("client-id").value;

if(!clientID){

alert("Enter Client ID");

return;

}

const redirectUri=
window.location.origin+
window.location.pathname;


const tokenClient=
google.accounts.oauth2.initTokenClient({

client_id:clientID,

scope:
"https://www.googleapis.com/auth/drive.readonly",

ux_mode:"redirect",

redirect_uri:redirectUri

});


tokenClient.requestAccessToken();

}


/////////////////////////////
// SHOW APP
/////////////////////////////

function showApp(){

document.getElementById("auth-card").style.display="none";

document.getElementById("folder-config").style.display="block";

document.getElementById("search-section").style.display="block";

}


/////////////////////////////
// SEARCH SONGS
/////////////////////////////

async function searchSongs(){

const query=
document.getElementById("search").value;

const folderId=
document.getElementById("folder-id").value;

if(query.length<2)return;


const res=
await gapi.client.drive.files.list({

q:`'${folderId}' in parents and name contains '${query}' and trashed=false`,

fields:"files(id,name)"

});


const files=res.result.files;

const results=
document.getElementById("results");

results.innerHTML="";


for(const file of files){

const clean=file.name.replace(/\.[^/.]+$/,"");

const meta=
await fetch(
`https://itunes.apple.com/search?term=${clean}&limit=1`
).then(r=>r.json());

const song=
meta.results[0]||{
trackName:file.name,
artistName:"Unknown",
artworkUrl100:""
};

const img=
song.artworkUrl100?
song.artworkUrl100.replace("100x100","600x600"):
"https://via.placeholder.com/100";


results.innerHTML+=`

<div class="result-item"
onclick="playSong('${file.id}',
'${song.trackName}',
'${song.artistName}')">

<img src="${img}">

<div>

<b>${song.trackName}</b><br>

<small>${song.artistName}</small>

</div>

</div>

`;

}

}


/////////////////////////////
// PLAY SONG
/////////////////////////////

function playSong(id,title,artist){

const audio=
document.getElementById("audio");

audio.src=
`https://www.googleapis.com/drive/v3/files/${id}?alt=media`;

audio.load();

audio.play();


document.getElementById("title").innerText=title;

document.getElementById("artist").innerText=artist;

document.getElementById("player").style.display="block";

}


</script>

</body>
</html>
