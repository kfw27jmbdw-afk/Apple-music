<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Music Mini-Lab</title>

<style>

:root{
--apple-red:#ff3b30;
--apple-dark:#1c1c1e;
}

body{
background:#000;
color:#fff;
font-family:-apple-system,sans-serif;
padding:20px;
display:flex;
flex-direction:column;
align-items:center;
}

.container{
width:100%;
max-width:400px;
}

h2{
text-align:center;
margin-bottom:30px;
}

.card{
background:var(--apple-dark);
padding:15px;
border-radius:12px;
margin-bottom:20px;
border:1px solid #333;
}

label{
font-size:11px;
color:var(--apple-red);
font-weight:bold;
}

input{
width:100%;
padding:12px;
margin:8px 0 15px 0;
background:#000;
border:1px solid #444;
color:#fff;
border-radius:8px;
}

button{
background:var(--apple-red);
color:white;
border:none;
padding:14px;
border-radius:10px;
width:100%;
font-weight:bold;
cursor:pointer;
}

#results{
margin-top:20px;
}

.result-item{
display:flex;
align-items:center;
background:var(--apple-dark);
padding:10px;
border-radius:10px;
margin-bottom:10px;
cursor:pointer;
}

.result-item img{
width:55px;
height:55px;
border-radius:6px;
margin-right:15px;
}

.result-info small{
color:#8e8e93;
}

#folder-config,
#search-section,
#player-ui{
display:none;
}

#player-ui{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
padding:20px;
border-top:1px solid #333;
text-align:center;
}

audio{
width:100%;
filter:invert(1);
}

</style>

</head>
<body>

<div class="container">

<h2> Mini-Lab</h2>

<div class="card" id="auth-card">

<label>Step 1: Authorization</label>

<input
id="client-id"
placeholder="Paste OAuth Client ID">

<button id="auth-btn" onclick="handleAuth()">
Connect Google Drive
</button>

</div>


<div class="card" id="folder-config">

<label>Step 2: Folder Config</label>

<input
id="folder-id"
placeholder="Folder ID">

</div>


<div id="search-section">

<label>Search</label>

<input
id="search-input"
placeholder="Search song..."
oninput="searchSongs()">

<div id="results"></div>

</div>

</div>


<div id="player-ui">

<b id="title"></b><br>

<small id="artist"></small>

<audio id="audio" controls></audio>

</div>


<script src="https://apis.google.com/js/api.js"></script>

<script src="https://accounts.google.com/gsi/client"></script>


<script>

let accessToken=null;
let tokenClient=null;
let gapiReady=false;
let gisReady=false;


//////////////////////////////
// INIT
//////////////////////////////

gapi.load("client", async()=>{

await gapi.client.init({

discoveryDocs:[
"https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"
]

});

gapiReady=true;

});


window.onload=()=>{

gisReady=true;

};


//////////////////////////////
// AUTH
//////////////////////////////

function handleAuth(){

if(!gapiReady||!gisReady){

alert("Wait 2 sec for API load");

return;

}

let clientID=
document.getElementById("client-id").value;

if(!clientID){

alert("Enter Client ID");

return;

}


tokenClient=
google.accounts.oauth2.initTokenClient({

client_id:clientID,

scope:"https://www.googleapis.com/auth/drive.readonly",

callback:(resp)=>{

accessToken=resp.access_token;

gapi.client.setToken({

access_token:accessToken

});


document.getElementById("auth-card").style.display="none";

document.getElementById("folder-config").style.display="block";

document.getElementById("search-section").style.display="block";

alert("Connected");

}

});


tokenClient.requestAccessToken({
prompt:"consent"
});

}


//////////////////////////////
// SEARCH
//////////////////////////////

async function searchSongs(){

let query=
document.getElementById("search-input").value;

let folderId=
document.getElementById("folder-id").value;

if(query.length<2)return;


let res=
await gapi.client.drive.files.list({

q:`'${folderId}' in parents and name contains '${query}' and trashed=false`,

fields:"files(id,name)"

});


let files=res.result.files;

let results=document.getElementById("results");

results.innerHTML="";


for(let file of files){

let cleanName=
file.name.replace(/\.[^/.]+$/,"");

let meta=
await fetch(
`https://itunes.apple.com/search?term=${cleanName}&limit=1`
).then(r=>r.json());

let song=
meta.results[0]||{
trackName:file.name,
artistName:"Unknown",
artworkUrl100:""
};

let img=
song.artworkUrl100?
song.artworkUrl100.replace("100x100","600x600"):
"https://via.placeholder.com/100";


results.innerHTML+=`

<div class="result-item"
onclick="playSong('${file.id}',
'${song.trackName}',
'${song.artistName}')">

<img src="${img}">

<div class="result-info">

<b>${song.trackName}</b>

<small>${song.artistName}</small>

</div>

</div>

`;

}

}


//////////////////////////////
// PLAY
//////////////////////////////

function playSong(id,title,artist){

let audio=document.getElementById("audio");

audio.src=
`https://www.googleapis.com/drive/v3/files/${id}?alt=media`;

audio.setAttribute(
"Authorization",
"Bearer "+accessToken
);

document.getElementById("title").innerText=title;

document.getElementById("artist").innerText=artist;

document.getElementById("player-ui").style.display="block";

audio.play();

}

</script>


</body>
</html>
